name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: ruff
        working-directory: backend
        run: ruff check .

      - name: mypy
        working-directory: backend
        run: mypy

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: tsc
        working-directory: frontend
        run: npx tsc --noEmit

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hobbylife
          POSTGRES_PASSWORD: hobbylife
          POSTGRES_DB: hobbylife
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hobbylife -d hobbylife"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://hobbylife:hobbylife@localhost:5432/hobbylife
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: hobbylife
      S3_ACCESS_KEY: hobbylife
      S3_SECRET_KEY: hobbylife123
      S3_PUBLIC_URL: http://localhost:9000/hobbylife
    steps:
      - uses: actions/checkout@v4

      # minio/minio has no usable default CMD (needs "server /data"), and
      # jobs.<id>.services doesn't support overriding a service container's
      # command -- run it as a plain background container instead. The runner
      # (not a nested container) executes the later steps, so "localhost:9000"
      # here resolves the same way it does for a developer running pytest
      # locally against `docker compose`'s published MinIO port.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=hobbylife \
            -e MINIO_ROOT_PASSWORD=hobbylife123 \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: pytest
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build ./backend -t hobbylife-api:ci

      - name: Build frontend image
        run: docker build ./frontend -t hobbylife-frontend:ci
