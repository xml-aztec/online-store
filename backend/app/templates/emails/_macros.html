{% macro button(text, url) -%}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:22px 0 4px 0;">
  <tr>
    <td style="background-color:#ff6a00; border-radius:10px;">
      <a href="{{ url }}" style="display:inline-block; padding:13px 28px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none;">{{ text }}</a>
    </td>
  </tr>
</table>
{%- endmacro %}
