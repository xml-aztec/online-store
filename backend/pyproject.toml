[project]
name = "hobbylife-api"
version = "0.1.0"
description = "HobbyLife backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "redis>=5.2",
    "boto3>=1.35",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "arq>=0.26",
    "jinja2>=3.1",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-slugify>=8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "boto3-stubs[s3]>=1.35",
    "factory-boy>=3.3",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated DDL: wrapping mechanical Column(...)/Constraint(...) lines adds no value.
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
# ТЗ 9: "покрытие сервисного слоя >= 80%". The default trace-based core loses
# track of code that runs on the other side of a greenlet switch -- which is
# exactly how SQLAlchemy's async engine bridges to asyncpg, so it systematically
# undercounts every service.py (measured: payments/service.py read as 51% covered
# under the default core, 93% under sysmon, for the identical test run). sysmon
# (PEP 669, Python 3.12+) instruments correctly across greenlet switches.
core = "sysmon"
omit = [
    "app/scripts/*",   # manual CLI (make seed), not exercised by the test suite by design
    "app/workers/settings.py",  # arq wiring only, no branching logic to cover
]
